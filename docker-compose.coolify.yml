# Coolify / Docker Compose stack for the AI services platform.
#
# Redis, Postgres, R2 and all inference endpoints are EXTERNAL, provided by env.
# This file intentionally defines no datastores: point REDIS_URL at a managed
# Redis and the workers become fully portable.
#
#   docker compose -f docker-compose.coolify.yml up --build
#
# In Coolify, deploy this compose file as one application and set the env vars
# in the app's Environment Variables (Coolify injects them as container env).
# Do NOT rely on a committed `.env` (it is generated from .env.example for local
# runs only); `env_file` is marked optional so the compose also parses without it.
#
# IMPORTANT — this stack is GATEWAY-ONLY on purpose.
# The Celery workers must run on the Oracle host, next to the inference service:
# they reach it container-to-container through the shared Coolify network
# (`http://inference:8000`), the only path that works from a container on that
# host. Running a second worker set here (as this file used to) creates a
# split-brain: both sets consume the same Redis queues, but only the Oracle set
# can talk to inference, so media jobs failed with "No route to host" whenever
# the primary worker picked them up. Workers are deployed by
# `docker-compose.workers.coolify.yml` (see docs/superpowers/infra/scripts/deploy-workers.sh).

name: agenteresolve-services

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
