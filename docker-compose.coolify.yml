# Coolify / Docker Compose stack for the AI services platform.
#
# Redis, Postgres, R2 and all inference endpoints are EXTERNAL, provided by env.
# This file intentionally defines no datastores: point REDIS_URL at a managed
# Redis and the workers become fully portable.
#
#   docker compose -f docker-compose.coolify.yml up --build
#
# In Coolify, deploy this compose file as one application and set the env vars
# in the app's Environment Variables (Coolify injects them as container env).
# Do NOT rely on a committed `.env` (it is generated from .env.example for local
# runs only); `env_file` is marked optional so the compose also parses without it.

name: agenteresolve-services

x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile.worker
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  volumes:
    - model-cache:/home/app/.cache

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-text:
    <<: *worker
    command:
      - celery
      - -A
      - worker.celery_app:celery_app
      - worker
      - -Q
      - text
      - --concurrency=1
      - --loglevel=INFO

  worker-vision:
    <<: *worker
    command:
      - celery
      - -A
      - worker.celery_app:celery_app
      - worker
      - -Q
      - vision
      - --concurrency=1
      - --loglevel=INFO

  worker-audio:
    <<: *worker
    command:
      - celery
      - -A
      - worker.celery_app:celery_app
      - worker
      - -Q
      - audio
      - --concurrency=1
      - --loglevel=INFO

volumes:
  model-cache:
