[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media"
version = "0.1.0"
description = "Oracle media service: YouTube -> MP3 (yt-dlp + ffmpeg)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "yt-dlp>=2024.1",
]

[tool.hatch.build.targets.wheel]
packages = ["media"]
