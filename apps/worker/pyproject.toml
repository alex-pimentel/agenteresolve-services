[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worker"
version = "0.1.0"
description = "Celery workers for the AI services platform"
requires-python = ">=3.12"
dependencies = [
    "common",
    "celery[redis]>=5.4",
    "httpx>=0.27",
]

[tool.uv.sources]
common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["worker"]
