# Adapted from agenteresolve-ci config for this Python (uv) repository.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  # Frontend (apps/web) — requires `npm ci` in apps/web first.
  - repo: local
    hooks:
      - id: web-format
        name: web format (prettier)
        entry: bash -c 'cd apps/web && npm run format:check'
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|jsx|json|css|md|ya?ml)$
        pass_filenames: false
      - id: web-lint
        name: web lint (eslint)
        entry: bash -c 'cd apps/web && npm run lint'
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
